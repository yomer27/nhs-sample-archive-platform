name: Build and Push Retention Checker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - "retention-checker/**"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./retention-checker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/retention-checker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/retention-checker:${{ github.sha }}
